// Passive replay telemetry: records each task's outcome and timing for the root build of every
// Gradle invocation. It changes no task inputs, outputs or build configuration.

import groovy.json.JsonOutput
import org.gradle.api.provider.Property
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.build.event.BuildEventsListenerRegistry
import org.gradle.tooling.events.FinishEvent
import org.gradle.tooling.events.OperationCompletionListener
import org.gradle.tooling.events.task.TaskFailureResult
import org.gradle.tooling.events.task.TaskFinishEvent
import org.gradle.tooling.events.task.TaskSkippedResult
import org.gradle.tooling.events.task.TaskSuccessResult

import javax.inject.Inject

abstract class ReplayTaskRecorder implements BuildService<Params>, OperationCompletionListener, AutoCloseable {
    interface Params extends BuildServiceParameters {
        Property<String> getOutput()
        Property<String> getTasks()
        Property<Long> getStartedAt()
    }

    protected final List<Map> records = Collections.synchronizedList(new ArrayList<Map>())

    @Override
    void onFinish(FinishEvent event) {
        if (!(event instanceof TaskFinishEvent)) {
            return
        }
        def result = event.result
        String outcome
        if (result instanceof TaskSkippedResult) {
            outcome = result.skipMessage == 'UP-TO-DATE' ? 'up-to-date' : 'skipped'
        } else if (result instanceof TaskFailureResult) {
            outcome = 'failed'
        } else if (result instanceof TaskSuccessResult) {
            outcome = result.fromCache ? 'from-cache' : (result.upToDate ? 'up-to-date' : 'executed')
        } else {
            outcome = 'unknown'
        }
        def rec = [path: event.descriptor.taskPath, outcome: outcome, start: result.startTime, end: result.endTime]
        if (result instanceof TaskSkippedResult) {
            rec.skip = result.skipMessage
        }
        records.add(rec)
    }

    @Override
    void close() {
        def out = new File(parameters.output.get())
        out.parentFile.mkdirs()
        def header = [schema: 1, tasks: parameters.tasks.get(), startedAt: parameters.startedAt.get(), endedAt: System.currentTimeMillis(), gradle: org.gradle.util.GradleVersion.current().version]
        out.withWriter('UTF-8') { w ->
            w.println(JsonOutput.toJson(header))
            synchronized (records) {
                records.each { w.println(JsonOutput.toJson(it)) }
            }
        }
    }
}

abstract class ReplayTelemetryPlugin implements Plugin<Gradle> {
    @Inject
    abstract BuildEventsListenerRegistry getRegistry()

    @Override
    void apply(Gradle gradle) {
        String dir = System.getenv('REPLAY_TELEMETRY_DIR')
        if (dir == null || dir.isEmpty() || gradle.parent != null) {
            return
        }
        String name = "tasks-${System.currentTimeMillis()}-${UUID.randomUUID()}.jsonl"
        def service = gradle.sharedServices.registerIfAbsent('replayTaskRecorder', ReplayTaskRecorder) { spec ->
            spec.parameters.output.set(new File(dir, name).absolutePath)
            spec.parameters.tasks.set(gradle.startParameter.taskNames.join(' '))
            spec.parameters.startedAt.set(System.currentTimeMillis())
        }
        registry.onTaskCompletion(service)
    }
}

apply plugin: ReplayTelemetryPlugin
